name: Deploy Sub-Store to Cloudflare

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sub-store-production
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.0.9"

jobs:
  deploy:
    name: Build / Test / Provision / Migrate / Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ============================================================
      # 2. Setup Node
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ============================================================
      # 3. Enable Corepack / pnpm
      # ============================================================
      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@${PNPM_VERSION} --activate

      # ============================================================
      # 4. Verify Cloudflare authentication
      # ============================================================
      - name: Verify Cloudflare authentication
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler whoami

      # ============================================================
      # 5. Sync official Sub-Store Front-End
      #
      # sync-official-frontend.mjs 会：
      #   - 自动识别官方默认分支
      #   - clone 官方 Front-End
      #   - pnpm install
      #   - pnpm build
      #   - 复制到 frontend-dist/
      # ============================================================
      - name: Sync and build official Sub-Store Front-End
        run: |
          node scripts/sync-official-frontend.mjs

      # ============================================================
      # 6. Verify frontend assets
      # ============================================================
      - name: Verify frontend build
        run: |
          echo "Checking frontend-dist..."

          if [ ! -d "frontend-dist" ]; then
            echo "ERROR: frontend-dist directory does not exist."
            exit 1
          fi

          if [ ! -f "frontend-dist/index.html" ]; then
            echo "ERROR: frontend-dist/index.html does not exist."
            echo "Frontend build appears to have failed."
            exit 1
          fi

          echo
          echo "Frontend assets:"
          find frontend-dist -maxdepth 2 -type f | head -100

      # ============================================================
      # 7. Install Worker dependencies
      # ============================================================
      - name: Install Worker dependencies
        working-directory: worker
        run: npm install

      # ============================================================
      # 8. Generate Cloudflare runtime types
      # ============================================================
      - name: Generate Worker runtime types
        working-directory: worker
        run: npx wrangler types

      # ============================================================
      # 9. TypeScript typecheck
      # ============================================================
      - name: TypeScript typecheck
        working-directory: worker
        run: npm run typecheck

      # ============================================================
      # 10. Run local Worker contract tests
      #
      # IMPORTANT:
      # frontend-dist MUST already exist here.
      # ============================================================
      - name: Start local Worker and run contract tests
        run: |
          node scripts/test-worker.mjs

      # ============================================================
      # 11. Verify Cloudflare resource configuration
      # ============================================================
      - name: Verify Cloudflare resource configuration
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=============================================="
          echo "Cloudflare D1"
          echo "=============================================="
          npx wrangler d1 list

          echo
          echo "=============================================="
          echo "Cloudflare KV"
          echo "=============================================="
          npx wrangler kv namespace list

          echo
          echo "=============================================="
          echo "Cloudflare R2"
          echo "=============================================="
          npx wrangler r2 bucket list || true

      # ============================================================
      # 12. Provision resources + first Worker deployment
      #
      # This MUST happen BEFORE D1 migration.
      #
      # Wrangler will create missing:
      #   - D1
      #   - KV
      #   - R2
      # ============================================================
      - name: Provision Cloudflare resources and deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=============================================="
          echo "Provisioning Cloudflare resources"
          echo "=============================================="

          npx wrangler deploy \
            --experimental-provision \
            --yes

      # ============================================================
      # 13. Verify D1 exists
      # ============================================================
      - name: Verify D1 database
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Checking D1 binding DB..."

          npx wrangler d1 info DB

      # ============================================================
      # 14. Apply remote D1 migrations
      # ============================================================
      - name: Apply D1 migrations
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=============================================="
          echo "Applying D1 migrations"
          echo "=============================================="

          npx wrangler d1 migrations apply DB \
            --remote \
            --yes

      # ============================================================
      # 15. Configure optional ADMIN_TOKEN
      # ============================================================
      - name: Configure ADMIN_TOKEN
        if: ${{ secrets.SUB_STORE_ADMIN_TOKEN != '' }}
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_TOKEN: ${{ secrets.SUB_STORE_ADMIN_TOKEN }}
        run: |
          printf '%s' "$ADMIN_TOKEN" \
            | npx wrangler secret put ADMIN_TOKEN

      # ============================================================
      # 16. Final deployment
      # ============================================================
      - name: Final Worker deployment
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy \
            --experimental-provision \
            --yes

      # ============================================================
      # 17. Show deployment information
      # ============================================================
      - name: Show deployment information
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=============================================="
          echo "Deployment completed successfully"
          echo "=============================================="

          npx wrangler deployments list

      # ============================================================
      # 18. Upload diagnostics
      # ============================================================
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sub-store-deployment-diagnostics
          path: |
            frontend-dist/
            worker/worker-configuration.d.ts
          if-no-files-found: ignore
          retention-days: 7
