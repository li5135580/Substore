name: Deploy Sub-Store to Cloudflare

on:
  push:
    branches:
      - main

  workflow_dispatch:

  # 允许 upstream-sync.yml 通过 workflow_dispatch 调用本工作流
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      SUB_STORE_ADMIN_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: sub-store-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build / Provision / Migrate / Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. Node.js
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ============================================================
      # 3. Verify Cloudflare authentication
      # ============================================================
      - name: Verify Cloudflare authentication
        working-directory: worker
        run: npx wrangler whoami

      # ============================================================
      # 4. Sync official Sub-Store Front-End
      # ============================================================
      - name: Sync official Sub-Store Front-End
        run: node scripts/sync-official-frontend.mjs

      # ============================================================
      # 5. Install root dependencies
      # ============================================================
      - name: Install root dependencies
        run: npm install

      # ============================================================
      # 6. Install Worker dependencies
      # ============================================================
      - name: Install Worker dependencies
        working-directory: worker
        run: npm install

      # ============================================================
      # 7. Build official frontend
      # ============================================================
      - name: Build official frontend
        working-directory: frontend
        run: npm run build

      # ============================================================
      # 8. Generate Cloudflare Worker runtime types
      # ============================================================
      - name: Generate Worker runtime types
        working-directory: worker
        run: npx wrangler types

      # ============================================================
      # 9. TypeScript typecheck
      # ============================================================
      - name: TypeScript typecheck
        working-directory: worker
        run: npm run typecheck

      # ============================================================
      # 10. Worker contract tests
      # ============================================================
      - name: Run Worker contract tests
        run: npm test

      # ============================================================
      # 11. Check / automatically provision Cloudflare resources
      #
      # IMPORTANT:
      # - D1
      # - KV
      # - R2
      #
      # are declared in wrangler.toml without account-specific IDs.
      #
      # Wrangler 4.45+ supports automatic provisioning.
      # We explicitly enable it here.
      # ============================================================
      - name: Provision Cloudflare resources and deploy Worker
        working-directory: worker
        run: |
          echo "=============================================="
          echo "Cloudflare resource provisioning"
          echo "=============================================="

          npx wrangler deploy \
            --experimental-provision \
            --yes

          echo "=============================================="
          echo "Initial Worker deployment completed"
          echo "=============================================="

      # ============================================================
      # 12. Verify D1 exists after provisioning
      # ============================================================
      - name: Verify D1 database
        working-directory: worker
        run: |
          echo "Available D1 databases:"
          npx wrangler d1 list

          echo
          echo "Checking binding: DB"
          npx wrangler d1 info DB

      # ============================================================
      # 13. Apply D1 migrations
      #
      # At this point the database must already exist because
      # wrangler deploy provisioned it.
      # ============================================================
      - name: Apply D1 migrations
        working-directory: worker
        run: |
          echo "=============================================="
          echo "Applying D1 migrations"
          echo "=============================================="

          npx wrangler d1 migrations apply DB \
            --remote \
            --experimental-provision

      # ============================================================
      # 14. Optional ADMIN_TOKEN
      #
      # ADMIN_TOKEN is not put into wrangler.toml.
      # This step only runs when GitHub Secret exists.
      #
      # If your current Worker does not require an ADMIN_TOKEN,
      # this step can be removed.
      # ============================================================
      - name: Configure ADMIN_TOKEN
        if: ${{ secrets.SUB_STORE_ADMIN_TOKEN != '' }}
        working-directory: worker
        run: |
          printf '%s' "${SUB_STORE_ADMIN_TOKEN}" \
            | npx wrangler secret put ADMIN_TOKEN
        env:
          SUB_STORE_ADMIN_TOKEN: ${{ secrets.SUB_STORE_ADMIN_TOKEN }}

      # ============================================================
      # 15. Final Worker deployment
      #
      # This guarantees the Worker receives any secret/config changes
      # after migration.
      # ============================================================
      - name: Final Worker deployment
        working-directory: worker
        run: |
          npx wrangler deploy \
            --experimental-provision \
            --yes

      # ============================================================
      # 16. Show deployment information
      # ============================================================
      - name: Show Worker deployment information
        working-directory: worker
        run: |
          echo "=============================================="
          echo "Deployment completed"
          echo "=============================================="

          npx wrangler deployments list

      # ============================================================
      # 17. Upload useful logs / generated files
      # ============================================================
      - name: Upload deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sub-store-deployment-diagnostics
          path: |
            worker/worker-configuration.d.ts
          if-no-files-found: ignore
          retention-days: 7
