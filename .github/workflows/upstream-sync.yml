name: Upstream Sync

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sub-store-upstream-sync
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11.0.9'

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check official upstreams
        id: upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-upstream.mjs

      - name: Show upstream decision
        run: cat .upstream/check-result.json

      - name: Stop when no upstream changes exist
        if: steps.upstream.outputs.frontend_changed != 'true' && steps.upstream.outputs.backend_changed != 'true' && steps.upstream.outputs.frontend_first_run != 'true' && steps.upstream.outputs.backend_first_run != 'true'
        run: echo 'No upstream changes; deployment is not required.'

      - name: Backend compatibility gate
        id: compat
        if: steps.upstream.outputs.backend_changed == 'true' || steps.upstream.outputs.backend_first_run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-backend-compat.mjs

      - name: Report incompatible backend change
        if: failure() && steps.compat.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/report-upstream-issue.mjs

      - name: Sync official frontend
        if: success() && (steps.upstream.outputs.frontend_changed == 'true' || steps.upstream.outputs.frontend_first_run == 'true' || steps.upstream.outputs.backend_changed == 'true' || steps.upstream.outputs.backend_first_run == 'true')
        env:
          FRONTEND_REPO: https://github.com/sub-store-org/Sub-Store-Front-End.git
          PNPM_VERSION: ${{ env.PNPM_VERSION }}
        run: corepack enable && node scripts/sync-official-frontend.mjs

      - name: Install Worker dependencies
        if: success() && (steps.upstream.outputs.frontend_changed == 'true' || steps.upstream.outputs.backend_changed == 'true' || steps.upstream.outputs.frontend_first_run == 'true' || steps.upstream.outputs.backend_first_run == 'true')
        working-directory: worker
        run: npm install

      - name: Typecheck Worker
        if: success() && (steps.upstream.outputs.frontend_changed == 'true' || steps.upstream.outputs.backend_changed == 'true' || steps.upstream.outputs.frontend_first_run == 'true' || steps.upstream.outputs.backend_first_run == 'true')
        working-directory: worker
        run: npm run typecheck

      - name: Worker contract tests
        if: success() && (steps.upstream.outputs.frontend_changed == 'true' || steps.upstream.outputs.backend_changed == 'true' || steps.upstream.outputs.frontend_first_run == 'true' || steps.upstream.outputs.backend_first_run == 'true')
        run: node scripts/test-worker.mjs

      - name: Cloudflare D1 migrations
        if: success() && (steps.upstream.outputs.frontend_changed == 'true' || steps.upstream.outputs.backend_changed == 'true' || steps.upstream.outputs.frontend_first_run == 'true' || steps.upstream.outputs.backend_first_run == 'true')
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy Cloudflare Worker
        if: success() && (steps.upstream.outputs.frontend_changed == 'true' || steps.upstream.outputs.backend_changed == 'true' || steps.upstream.outputs.frontend_first_run == 'true' || steps.upstream.outputs.backend_first_run == 'true')
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Configure optional ADMIN_TOKEN
        if: success()
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_TOKEN: ${{ secrets.SUB_STORE_ADMIN_TOKEN }}
        run: |
          if [ -n "$ADMIN_TOKEN" ]; then
            printf '%s' "$ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN
          else
            echo "SUB_STORE_ADMIN_TOKEN not configured; skipping."
          fi

      - name: Update upstream state after successful deployment
        if: success() && (steps.upstream.outputs.frontend_changed == 'true' || steps.upstream.outputs.backend_changed == 'true' || steps.upstream.outputs.frontend_first_run == 'true' || steps.upstream.outputs.backend_first_run == 'true')
        run: node scripts/update-upstream-state.mjs

      - name: Commit upstream state
        if: success() && (steps.upstream.outputs.frontend_changed == 'true' || steps.upstream.outputs.backend_changed == 'true' || steps.upstream.outputs.frontend_first_run == 'true' || steps.upstream.outputs.backend_first_run == 'true')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .upstream/state.json
          git diff --cached --quiet && echo 'No state changes to commit.' || git commit -m "chore: update upstream state"
          git push
