name = "sub-store-cloudflare"
main = "src/index.ts"
compatibility_date = "2026-08-17"
workers_dev = true

[assets]
directory = "../frontend-dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
SUB_STORE_CORS_ALLOWED_ORIGINS = "*"
CACHE_TTL_SECONDS = "900"
UPSTREAM_REPO = "https://github.com/sub-store-org/Sub-Store"
UPSTREAM_FRONTEND_REPO = "https://github.com/sub-store-org/Sub-Store-Front-End"

# Wrangler automatic resource provisioning:
# Intentionally omit account-specific resource IDs.
# D1/KV/R2 will be provisioned and linked on deploy.
[[d1_databases]]
binding = "DB"
database_name = "sub-store-db"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "CACHE"

[[r2_buckets]]
binding = "R2"
bucket_name = "sub-store-assets"

[triggers]
crons = ["*/30 * * * *"]

[observability]
enabled = true

# After deployment you can replace workers.dev with a custom domain route in Cloudflare.
