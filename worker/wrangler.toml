name = "sub-store-cloudflare"
main = "src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = true

[assets]
directory = "../frontend-dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
SUB_STORE_CORS_ALLOWED_ORIGINS = "*"
CACHE_TTL_SECONDS = "300"

[[d1_databases]]
binding = "DB"
database_name = "sub-store-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# R2 is optional. Create the bucket first or remove this block.
[[r2_buckets]]
binding = "R2"
bucket_name = "sub-store-assets"

[triggers]
crons = ["*/15 * * * *"]

[observability]
enabled = true

# Production example:
# routes = [
#   { pattern = "sub.example.com", custom_domain = true }
# ]
