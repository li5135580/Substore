name = "sub-store-cloudflare"
main = "src/index.ts"
compatibility_date = "2026-08-17"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "../frontend-dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
SUB_STORE_CORS_ALLOWED_ORIGINS = "*"
CACHE_TTL_SECONDS = "900"
UPSTREAM_REPO = "https://github.com/sub-store-org/Sub-Store"
UPSTREAM_FRONTEND_REPO = "https://github.com/sub-store-org/Sub-Store-Front-End"

# Automatic provisioning:
# Do not specify account-specific resource IDs here.
# For R2, also omit bucket_name so Wrangler can create the bucket.
[[d1_databases]]
binding = "DB"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "CACHE"

[[r2_buckets]]
binding = "R2"

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true
